<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>飞书剪存pro 保存位置设置</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1280px; height: 800px; margin: 0; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202124; background: #eef2f6; }
    .browserbar { height: 62px; display: flex; align-items: center; gap: 14px; padding: 0 22px; border-bottom: 1px solid #dce1e7; background: #f6f7f9; }
    .dots { display: flex; gap: 7px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: #b8c0ca; }
    .address { flex: 1; height: 36px; display: flex; align-items: center; padding: 0 16px; border: 1px solid #d7dce2; border-radius: 7px; color: #59636f; background: #fff; font-size: 14px; }
    main { height: 738px; padding: 34px 0 54px; overflow: hidden; }
    .panel { width: 760px; margin: 0 auto; overflow: hidden; border: 1px solid #dfe3e8; border-radius: 8px; background: #fff; box-shadow: 0 16px 42px rgba(35,53,84,.12); }
    header { display: flex; align-items: center; gap: 13px; padding: 20px 24px; border-bottom: 1px solid #e5e8ec; }
    header img { width: 46px; height: 46px; }
    h1 { margin: 0 0 3px; font-size: 23px; letter-spacing: 0; }
    header p { margin: 0; color: #667085; font-size: 13px; }
    section { padding: 20px 24px; }
    h2 { margin: 0 0 14px; font-size: 17px; letter-spacing: 0; }
    .location { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-top: 1px solid #edf0f3; border-bottom: 1px solid #edf0f3; }
    .location div { display: grid; gap: 5px; color: #667085; font-size: 13px; }
    .location strong { color: #202124; font-size: 15px; }
    button { height: 38px; padding: 0 16px; border: 0; border-radius: 6px; color: #fff; background: #3370ff; font: inherit; }
    label { display: grid; gap: 8px; margin-top: 18px; color: #344054; font-size: 14px; }
    input { height: 42px; padding: 0 12px; border: 1px solid #cfd5dc; border-radius: 6px; color: #202124; background: #fff; font: inherit; }
    .hint { margin: 12px 0 0; color: #667085; font-size: 13px; line-height: 1.55; }
    .storage { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
    .storage div { padding: 13px 14px; border: 1px solid #dfe3e8; border-radius: 6px; background: #f8fafc; }
    .storage strong { display: block; margin-bottom: 5px; font-size: 14px; }
    .storage span { color: #667085; font-size: 12px; }
    footer { display: flex; align-items: center; justify-content: flex-end; padding: 15px 24px; border-top: 1px solid #e5e8ec; background: #fbfcfd; }
  </style>
</head>
<body>
  <div class="browserbar">
    <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <div class="address">飞书剪存pro 设置</div>
  </div>
  <main>
    <div class="panel">
      <header><img src="assets/icon-1024.png" alt="" /><div><h1>飞书剪存pro</h1><p>剪存设置</p></div></header>
      <section>
        <h2>保存位置</h2>
        <div class="location"><div><span>当前保存位置</span><strong>云盘根目录 / 飞书剪存</strong></div><button>选择保存文件夹</button></div>
        <label><span>多维表格名称</span><input value="网页剪存库" readonly /></label>
        <p class="hint">未选择时，默认使用云盘根目录下的“飞书剪存”文件夹。点击“选择保存文件夹”后才读取一级文件夹，进入文件夹后再按需读取下一层。</p>
        <p class="hint">多维表格名称可以修改，并始终与剪存的云文档存放在同一文件夹内。</p>
        <div class="storage"><div><strong>飞书云文档</strong><span>排版后的正文、图片、表格与公式</span></div><div><strong>网页剪存库</strong><span>标题、日期、单位、标签与原链接</span></div></div>
      </section>
      <footer><button>保存设置</button></footer>
    </div>
  </main>
</body>
</html>
