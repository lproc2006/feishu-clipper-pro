<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>飞书剪存pro 设置</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon48.png" alt="" />
        <div>
          <h1>飞书剪存pro</h1>
          <p>剪存设置</p>
        </div>
      </header>

      <form id="settings-form">
        <section>
          <h2>保存位置</h2>
          <div class="selected-location">
            <div>
              <span>当前保存位置</span>
              <strong id="selected-folder-path">云盘根目录 / 飞书剪存</strong>
            </div>
            <div class="location-actions">
              <button id="use-default-folder" class="secondary-button" type="button" hidden>恢复默认</button>
              <button id="choose-folder" type="button">选择保存文件夹</button>
            </div>
          </div>
          <div id="folder-browser" class="folder-browser" aria-label="飞书云盘文件夹浏览器" hidden>
            <div class="folder-browser-header">
              <div>
                <strong>选择保存文件夹</strong>
                <span id="connection-status" class="connection-status" role="status">尚未读取云盘</span>
              </div>
              <div class="folder-browser-actions">
                <button id="refresh-folders" class="secondary-button" type="button">刷新</button>
                <button id="close-folder-browser" class="secondary-button" type="button">关闭</button>
              </div>
            </div>
            <nav id="folder-breadcrumb" class="folder-breadcrumb" aria-label="文件夹路径"></nav>
            <div id="folder-list" class="folder-list" role="list"></div>
            <div class="folder-browser-footer">
              <span id="folder-level-status"></span>
              <button id="use-current-folder" type="button" disabled>使用当前文件夹</button>
            </div>
          </div>
          <label>
            <span>多维表格名称</span>
            <input id="base-name" name="baseName" maxlength="50" required />
          </label>
          <p class="hint">未选择时，默认使用云盘根目录下的“飞书剪存”文件夹。点击“选择保存文件夹”后才读取一级文件夹，进入文件夹后再按需读取下一层。</p>
          <p class="hint">多维表格默认名为“网页剪存库”，可自行修改，并始终与剪存的云文档存放在同一文件夹内。</p>
        </section>

        <section>
          <h2>重复网页</h2>
          <label class="radio-row">
            <input type="radio" name="duplicateBehavior" value="show_existing" />
            <span>先显示已有记录，需要时再另存</span>
          </label>
          <label class="radio-row">
            <input type="radio" name="duplicateBehavior" value="save_copy" />
            <span>每次都另存一份</span>
          </label>
        </section>

        <footer>
          <span id="save-status" role="status"></span>
          <button type="submit">保存设置</button>
        </footer>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
