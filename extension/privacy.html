<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>飞书剪存pro 隐私说明</title>
    <style>
      body { margin: 0; font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202124; background: #fff; }
      main { max-width: 760px; margin: 0 auto; padding: 40px 24px 64px; }
      h1 { font-size: 28px; }
      h2 { margin-top: 28px; font-size: 20px; }
      a { color: #0b57d0; }
      code { padding: 2px 5px; background: #f1f3f5; border-radius: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>隐私说明</h1>
      <p>飞书剪存pro 仅在你点击扩展按钮时处理当前标签页的标题、网址、正文、图片引用及发布时间等文章信息。</p>
      <h2>数据流向</h2>
      <p>页面信息先发送到你电脑上的 <code>127.0.0.1</code> 本机配套服务，再由飞书官方 lark-cli 写入你授权的飞书云盘和多维表格。插件开发者没有中转服务器，也无法查看这些内容。</p>
      <h2>本地数据</h2>
      <p>本机服务仅保存云文档与多维表格记录的关联标识，用于执行双向删除同步。卸载本机服务时可一并删除这些本地数据。</p>
      <h2>第三方与声明</h2>
      <p>本产品不出售数据、不投放广告、不做行为分析。飞书和 Lark 是其各自权利人的商标；本产品是独立开源工具，并非飞书或 Lark 官方产品。</p>
    </main>
  </body>
</html>
